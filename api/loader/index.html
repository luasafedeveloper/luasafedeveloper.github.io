<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Access Denied</title>
    <style>
        body { background-color: #121212; color: #ff5555; font-family: sans-serif; text-align: center; padding-top: 100px; }
        h1 { font-size: 24px; margin-bottom: 10px; }
        p { color: #aaaaaa; font-size: 14px; }
    </style>
</head>
<body>

    <div id="denied-view">
        <h1>페이지를 볼 권한이 없습니다.</h1>
        <p>이 링크는 브라우저에서 직접 열 수 없으며, 올바른 키와 로더를 통해서만 실행할 수 있습니다.</p>
    </div>

    <script>
        // URL 파라미터에서 키 값 가져오기
        const urlParams = new URLSearchParams(window.location.search);
        const key = urlParams.get('key');

        // 실행기(Roblox Executor) 환경인지 체크 (브라우저가 아닐 경우나 내부 규칙 활용)
        // 브라우저로 접속한 경우면 화면을 그대로 두고 종료
        const isBrowser = navigator.userAgent.includes("Mozilla") || navigator.userAgent.includes("Chrome") || navigator.userAgent.includes("Safari");

        if (key) {
            // 로컬스토리지에 저장된 소스코드를 불러옴
            const savedScript = localStorage.getItem("script_" + key);

            if (savedScript) {
                // 실행기나 권한 환경에서 요청한 경우 HTML을 지우고 순수 루아 소스코드만 출력
                document.open();
                document.write(savedScript);
                document.close();
            } else {
                // 키가 틀렸거나 등록되지 않은 경우
                if (!isBrowser) {
                    document.open();
                    document.write("-- Error: Invalid or Expired Key");
                    document.close();
                }
            }
        }
    </script>

</body>
</html>
