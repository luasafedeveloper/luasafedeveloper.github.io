<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuaSafe - Script Protector & Loader</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 500px;
        }
        h2 {
            margin-bottom: 5px;
            font-size: 22px;
            color: #4CAF50;
            text-align: center;
        }
        .subtitle {
            color: #aaaaaa;
            font-size: 13px;
            margin-bottom: 20px;
            text-align: center;
        }
        .section {
            background: #252526;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid #3c3c3c;
        }
        .section h3 {
            font-size: 15px;
            margin-bottom: 10px;
            color: #ffcc00;
        }
        label {
            display: block;
            font-size: 12px;
            margin-bottom: 5px;
            color: #dddddd;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            background: #2d2d2d;
            border: 1px solid #3c3c3c;
            color: #fff;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
            margin-bottom: 10px;
        }
        textarea {
            height: 80px;
            resize: none;
            font-family: monospace;
        }
        input:focus, textarea:focus {
            border-color: #4CAF50;
        }
        button {
            width: 100%;
            padding: 11px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #45a049;
        }
        .blue-btn {
            background: #007acc;
        }
        .blue-btn:hover {
            background: #005999;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>LuaSafe Manager</h2>
        <p class="subtitle">소스코드 등록 및 키 기반 로더 생성 시스템</p>
        
        <!-- [1] 관리자 영역: 소스코드 등록 및 키 생성 -->
        <div class="section">
            <h3>1. 소스 등록 및 키 발급 (관리자)</h3>
            <label for="sourceInput">보호할 루아 소스코드 입력</label>
            <textarea id="sourceInput" placeholder="print('Hello World!')"></textarea>
            
            <label for="newKeyInput">발급할 인증 키 (Key)</label>
            <input type="text" id="newKeyInput" placeholder="예: MY-SECRET-KEY-001">
            
            <button onclick="registerScript()">소스 저장 및 키 생성</button>
        </div>

        <!-- [2] 사용자 영역: 키로 로더 생성 -->
        <div class="section">
            <h3>2. 실행용 로더 생성 (사용자)</h3>
            <label for="keyInput">인증 키 입력</label>
            <input type="text" id="keyInput" placeholder="발급받은 키를 입력하세요">
            <button class="blue-btn" onclick="generateLoader()">로더 코드 생성</button>
            
            <label for="loaderOutput" style="margin-top: 10px;">생성된 로더 코드</label>
            <textarea id="loaderOutput" readonly placeholder="여기에 로더 코드가 표시됩니다."></textarea>
        </div>
    </div>

    <script>
        function registerScript() {
            const source = document.getElementById('sourceInput').value.trim();
            const key = document.getElementById('newKeyInput').value.trim();
            
            if (!source || !key) {
                alert("소소스코드와 발급할 키를 모두 입력해주세요!");
                return;
            }
            
            // 로컬스토리지에 키와 소스코드를 매칭해서 저장 (임시 데이터베이스 역할)
            localStorage.setItem("script_" + key, source);
            alert("성공적으로 소스가 등록되고 키가 발급되었습니다!");
            document.getElementById('newKeyInput').value = '';
        }

        function generateLoader() {
            const userKey = document.getElementById('keyInput').value.trim();
            if (!userKey) {
                alert("인증 키를 입력해주세요!");
                return;
            }
            
            const domain = window.location.origin;
            const loaderCode = `loadstring(game:HttpGet("${domain}/api/loader?key=" .. "${userKey}"))()`;
            
            document.getElementById('loaderOutput').value = loaderCode;
        }
    </script>

</body>
</html>
