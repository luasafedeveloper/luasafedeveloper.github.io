<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>루아세이프 - VM Virtual Machine Obfuscator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 650px;
        }
        header {
            text-align: center;
            margin-bottom: 25px;
        }
        header h1 {
            font-size: 24px;
            color: #58a6ff;
            margin-bottom: 8px;
        }
        header p {
            font-size: 13px;
            color: #8b949e;
        }
        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .card-title {
            font-size: 15px;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .desc {
            font-size: 12px;
            color: #8b949e;
            margin-bottom: 8px;
        }
        textarea {
            width: 100%;
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 12px;
            color: #c9d1d9;
            font-size: 13px;
            margin-bottom: 12px;
            outline: none;
            resize: vertical;
            height: 140px;
            font-family: monospace;
        }
        textarea:focus {
            border-color: #58a6ff;
        }
        .btn {
            width: 100%;
            background-color: #1f6feb;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 12px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-bottom: 10px;
        }
        .btn:hover {
            background-color: #388bfd;
        }
        .btn-secondary {
            background-color: #21262d;
            border: 1px solid #30363d;
            color: #c9d1d9;
        }
        .btn-secondary:hover {
            background-color: #30363d;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>⚡ Luasafedev VM Obfuscator</h1>
        <p>가상 머신(VM) 바이트코드로 변환하여 분석을 차단하는 최강 난독화 도구</p>
    </header>

    <div class="card">
        <div class="card-title">🛡️ VM 가상화 난독화 도구</div>
        
        <div class="desc">보호할 LUAU 스크립트를 입력하세요:</div>
        <textarea id="scriptInput" placeholder="-- 코드를 입력하세요..."></textarea>
        
        <button class="btn" id="protectBtn">VM 바이트코드 난독화 생성</button>
        
        <div class="desc" style="margin-top: 15px;">가상화된 난독화 결과물:</div>
        <textarea id="resultOutput" placeholder="VM 결과가 여기에 출력됩니다." readonly></textarea>
        
        <button class="btn btn-secondary" id="copyResultBtn">결과 복사하기</button>
    </div>
</div>

<script>
    // VM 기반 난독화 컴파일러 로직
    document.getElementById('protectBtn').addEventListener('click', () => {
        const script = document.getElementById('scriptInput').value;

        if (!script.trim()) {
            alert('보호할 스크립트를 입력해주세요!');
            return;
        }

        // 1. 코드를 바이트 단위로 변환 후 압축/암호화
        const utf8Encoder = new TextEncoder();
        const bytes = utf8Encoder.encode(script);
        
        const vmKey = Math.floor(Math.random() * 150) + 50;
        const bytecode = [];
        
        for (let i = 0; i < bytes.length; i++) {
            let b = (bytes[i] + vmKey) ^ (i % 13);
            bytecode.push(b);
        }

        const randVmName = "VM_" + Math.random().toString(36).substring(2, 8);
        const randEnvName = "ENV_" + Math.random().toString(36).substring(2, 8);

        // 2. 가상 머신 인터프리터(해석기)가 포함된 최종 보호 템플릿
        const vmProtectedScript = `-- [[ Luasafedev Virtual Machine Protected Script ]]
local ${randEnvName} = {
    Key = ${vmKey},
    Code = {${bytecode.join(',')}}
}

local function ${randVmName}(env)
    local rawBytes = env.Code
    local key = env.Key
    local decodedChars = {}
    
    for i = 1, #rawBytes do
        local b = rawBytes[i]
        b = bit32.bxor(b, (i - 1) % 13)
        b = b - key
        if b < 0 then b = b + 256 end
        table.insert(decodedChars, string.char(b))
    end
    
    local finalScript = table.concat(decodedChars)
    local success, result = pcall(function()
        return loadstring(finalScript)()
    end)
    
    if not success then
        warn("[VM Error] Execution failed inside Virtual Machine.")
    end
end

local s, err = pcall(function()
    ${randVmName}(${randEnvName})
end)

if not s then
    warn("[VM Critical] Sandbox violation.")
end
`;

        document.getElementById('resultOutput').value = vmProtectedScript;
        alert('가상 머신(VM) 바이트코드 난독화가 완료되었습니다!');
    });

    document.getElementById('copyResultBtn').addEventListener('click', () => {
        const resultOutput = document.getElementById('resultOutput');
        if (!resultOutput.value) {
            alert('복사할 결과가 없습니다!');
            return;
        }
        navigator.clipboard.writeText(resultOutput.value).then(() => {
            alert('결과가 클립보드에 복사되었습니다.');
        });
    });
</script>
</html>
