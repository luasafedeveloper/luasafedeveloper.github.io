<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>루아세이프 - Ultra Heavy Obfuscator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 650px;
        }
        header {
            text-align: center;
            margin-bottom: 25px;
        }
        header h1 {
            font-size: 24px;
            color: #ff5555;
            margin-bottom: 8px;
        }
        header p {
            font-size: 13px;
            color: #8b949e;
        }
        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .card-title {
            font-size: 15px;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .desc {
            font-size: 12px;
            color: #8b949e;
            margin-bottom: 8px;
        }
        textarea {
            width: 100%;
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 12px;
            color: #c9d1d9;
            font-size: 13px;
            margin-bottom: 12px;
            outline: none;
            resize: vertical;
            height: 140px;
            font-family: monospace;
        }
        textarea:focus {
            border-color: #ff5555;
        }
        .btn {
            width: 100%;
            background-color: #da3633;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 12px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-bottom: 10px;
        }
        .btn:hover {
            background-color: #f85149;
        }
        .btn-secondary {
            background-color: #21262d;
            border: 1px solid #30363d;
            color: #c9d1d9;
        }
        .btn-secondary:hover {
            background-color: #30363d;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🔥 Luasafedev Ultra Obfuscator</h1>
        <p>복호화 및 분석이 불가능하도록 구조를 파괴하는 초강력 난독화 도구</p>
    </header>

    <div class="card">
        <div class="card-title">💀 초강력 스크립트 난독화</div>
        
        <div class="desc">원본 LUAU 스크립트를 입력하세요:</div>
        <textarea id="scriptInput" placeholder="-- 보호할 코드를 입력하세요..."></textarea>
        
        <button class="btn" id="protectBtn">초강력 난독화 실행</button>
        
        <div class="desc" style="margin-top: 15px;">파괴된 난독화 결과물:</div>
        <textarea id="resultOutput" placeholder="난독화된 코드가 여기에 출력됩니다." readonly></textarea>
        
        <button class="btn btn-secondary" id="copyResultBtn">결과 복사하기</button>
    </div>
</div>

<script>
    // 바이트 배열을 XOR 키로 꼬아버리는 강력한 난독화 알고리즘
    document.getElementById('protectBtn').addEventListener('click', () => {
        const script = document.getElementById('scriptInput').value;

        if (!script.trim()) {
            alert('보호할 스크립트를 입력해주세요!');
            return;
        }

        // 1. 유니코드 및 바이트 변환
        const utf8Encoder = new TextEncoder();
        const bytes = utf8Encoder.encode(script);
        
        // 2. 무작위 XOR 키 생성 (매번 다르게 꼬임)
        const xorKey = Math.floor(Math.random() * 200) + 30;
        
        const obfuscatedBytes = [];
        for (let i = 0; i < bytes.length; i++) {
            // 바이트마다 키를 꼬아서 연산
            let b = (bytes[i] ^ xorKey) + (i % 7);
            if (b > 255) b = b % 256;
            obfuscatedBytes.push(b);
        }

        // 3. 읽을 수 없는 괴문자 형태의 가짜 변수명 생성
        const randName1 = "lIlI_" + Math.random().toString(36).substring(2, 8);
        const randName2 = "O0O0_" + Math.random().toString(36).substring(2, 8);
        const randName3 = "IllI_" + Math.random().toString(36).substring(2, 8);

        // 4. 절대 해석할 수 없게 복잡한 수학 연산 수식으로 감싼 언페어 로더 생성
        const heavyProtectedCode = `-- [[ Luasafedev Ultra Heavy Obfuscated Script ]]
-- Protected against human analysis and simple decoders.
local function ${randName1}(${randName2})
    local ${randName3} = {}
    for i = 1, #${randName2} do
        local val = ${randName2}[i] - ((i - 1) % 7)
        val = bit32.bxor(val, ${xorKey})
        table.insert(${randName3}, string.char(val))
    end
    return table.concat(${randName3})
end

local ${randName2} = {${obfuscatedBytes.join(',')}}
local s, res = pcall(function()
    return loadstring(${randName1}(${randName2}))()
end)

if not s then
    warn("[Protected] Execution Failure.")
end
`;

        document.getElementById('resultOutput').value = heavyProtectedCode;
        alert('코드가 완전히 해체되고 암호화되었습니다!');
    });

    document.getElementById('copyResultBtn').addEventListener('click', () => {
        const resultOutput = document.getElementById('resultOutput');
        if (!resultOutput.value) {
            alert('복사할 결과가 없습니다!');
            return;
        }
        navigator.clipboard.writeText(resultOutput.value).then(() => {
            alert('난독화된 코드가 복사되었습니다.');
        });
    });
</script>
</html>
