<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Script Loader & Key System</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }
        h2 {
            margin-bottom: 10px;
            font-size: 22px;
            color: #4CAF50;
        }
        p {
            color: #aaaaaa;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label {
            display: block;
            font-size: 13px;
            margin-bottom: 5px;
            color: #dddddd;
        }
        input {
            width: 100%;
            padding: 12px;
            background: #2d2d2d;
            border: 1px solid #3c3c3c;
            color: #fff;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }
        input:focus {
            border-color: #4CAF50;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 5px;
        }
        button:hover {
            background: #45a049;
        }
        .output-box {
            margin-top: 20px;
            text-align: left;
        }
        textarea {
            width: 100%;
            height: 90px;
            background: #2d2d2d;
            border: 1px solid #3c3c3c;
            color: #4CAF50;
            padding: 10px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 13px;
            resize: none;
            outline: none;
        }
        .copy-btn {
            background: #007acc;
            margin-top: 8px;
        }
        .copy-btn:hover {
            background: #005999;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Script Loader System</h2>
        <p>인증 키를 입력하고 실행용 로더를 생성하세요.</p>
        
        <div class="input-group">
            <label for="keyInput">인증 키 (Key)</label>
            <input type="text" id="keyInput" placeholder="예: KEY-xxxx-xxxx">
        </div>
        
        <button onclick="generateLoader()">로더 생성하기</button>
        
        <div class="output-box">
            <label for="loaderOutput">생성된 로더 코드</label>
            <textarea id="loaderOutput" readonly placeholder="여기에 로더 코드가 표시됩니다."></textarea>
            <button class="copy-btn" onclick="copyLoader()">클립보드 복사</button>
        </div>
    </div>

    <script>
        function generateLoader() {
            const userKey = document.getElementById('keyInput').value.trim();
            if (!userKey) {
                alert("인증 키를 입력해주세요!");
                return;
            }
            
            // 현재 사이트 주소를 기반으로 로더 링크 자동 조합
            const domain = window.location.origin;
            const loaderCode = `loadstring(game:HttpGet("${domain}/api/loader?key=" .. "${userKey}"))()`;
            
            document.getElementById('loaderOutput').value = loaderCode;
        }

        function copyLoader() {
            const outputBox = document.getElementById('loaderOutput');
            if (!outputBox.value) {
                alert("먼저 로더를 생성해주세요!");
                return;
            }
            outputBox.select();
            document.execCommand('copy');
            alert("로더 코드가 클립보드에 복사되었습니다!");
        }
    </script>

</body>
</html>
