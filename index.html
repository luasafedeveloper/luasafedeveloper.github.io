<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>루아세이프 - Keyless Luau 난독화 도구</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
        }
        header {
            text-align: center;
            margin-bottom: 25px;
        }
        header h1 {
            font-size: 24px;
            color: #ffffff;
            margin-bottom: 8px;
        }
        header p {
            font-size: 13px;
            color: #8b949e;
        }
        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .card-title {
            font-size: 15px;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .desc {
            font-size: 12px;
            color: #8b949e;
            margin-bottom: 8px;
        }
        textarea {
            width: 100%;
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 12px;
            color: #c9d1d9;
            font-size: 13px;
            margin-bottom: 12px;
            outline: none;
            resize: vertical;
            height: 140px;
            font-family: monospace;
        }
        textarea:focus {
            border-color: #58a6ff;
        }
        .btn {
            width: 100%;
            background-color: #238636;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 12px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-bottom: 10px;
        }
        .btn:hover {
            background-color: #2ea043;
        }
        .btn-secondary {
            background-color: #21262d;
            border: 1px solid #30363d;
            color: #c9d1d9;
        }
        .btn-secondary:hover {
            background-color: #30363d;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🔒 루아세이프 (Keyless)</h1>
        <p>키 인증 없는 깔끔한 Luau 소스 코드 보호 도구</p>
    </header>

    <!-- 스크립트 보호기 섹션 -->
    <div class="card">
        <div class="card-title">🛡️ 키리스 스크립트 난독화 도구</div>
        
        <div class="desc">보호할 LUAU 스크립트를 입력하세요:</div>
        <textarea id="scriptInput" placeholder="-- 이곳에 보호할 루아 코드를 입력하세요..."></textarea>
        
        <button class="btn" id="protectBtn">키리스 보호 로더 생성</button>
        
        <div class="desc" style="margin-top: 15px;">출력 결과 (Protected Loader):</div>
        <textarea id="resultOutput" placeholder="난독화된 로더 결과가 여기에 표시됩니다." readonly></textarea>
        
        <button class="btn btn-secondary" id="copyResultBtn">결과 복사하기</button>
    </div>
</div>

<script>
    // 키리스 보호 로더 생성 버튼 이벤트
    document.getElementById('protectBtn').addEventListener('click', () => {
        const script = document.getElementById('scriptInput').value;

        if (!script.trim()) {
            alert('보호할 루아 스크립트를 입력해주세요!');
            return;
        }

        // 한글 깨짐 방지 Base64 인코딩
        const encodedScript = btoa(unescape(encodeURIComponent(script)));

        // 키 입력 없이 안전하게 감싸서 실행하는 키리스(Keyless) 로더 템플릿
        const protectedLoader = `-- [ Luasafedev Keyless Protected Loader ]
local SCRIPT_B64 = "${encodedScript}"

local success, err = pcall(function()
    local HttpService = game:GetService("HttpService")
    local decodedScript = HttpService:Base64Decode(SCRIPT_B64)
    loadstring(decodedScript)()
end)

if not success then
    warn("[Luasafedev] ❌ 스크립트 실행 오류: " .. tostring(err))
end
`;

        document.getElementById('resultOutput').value = protectedLoader;
        alert('키리스 난독화 로더가 성공적으로 생성되었습니다!');
    });

    // 결과 복사하기 버튼 이벤트
    document.getElementById('copyResultBtn').addEventListener('click', () => {
        const resultOutput = document.getElementById('resultOutput');
        if (!resultOutput.value) {
            alert('복사할 결과가 없습니다!');
            return;
        }
        navigator.clipboard.writeText(resultOutput.value).then(() => {
            alert('난독화된 로더가 클립보드에 복사되었습니다.');
        });
    });
</script>

</body>
</html>
